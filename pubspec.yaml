name: ialert_flutter
description: Flutter SDK for iAlert push notifications. Registers the device, keeps a Gateway WebSocket open and syncs the per-device Inbox so messages arrive even when international internet is cut.
version: 0.6.0
homepage: https://ialert.ir
repository: https://github.com/iAlert-ai/ialert-flutter
issue_tracker: https://github.com/iAlert-ai/ialert-flutter/issues
topics:
  - push-notifications
  - notifications
  - websocket

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: ir.ialert.flutter
        pluginClass: IAlertFlutterPlugin
      ios:
        pluginClass: IAlertFlutterPlugin
