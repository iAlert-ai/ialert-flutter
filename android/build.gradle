group = "ir.ialert.flutter"
version = "0.5.0"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
        // `-PialertAndroidLocal`: use the Android SDK from `./gradlew publishToMavenLocal`.
        if (project.hasProperty("ialertAndroidLocal")) mavenLocal()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "ir.ialert.flutter"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 23
    }
}

dependencies {
    if (project.hasProperty("ialertAndroidLocal")) {
        api("ir.ialert:ialert-android:0.5.0")
    } else {
        api("com.github.iAlert-ai:ialert-android:v0.5.0")
    }
}
