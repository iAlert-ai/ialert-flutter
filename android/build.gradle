group = "ir.ialert.flutter"
version = "0.5.1"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
        // `-PialertAndroidLocal`: use the Android SDK from `./gradlew publishToMavenLocal`.
        if (project.hasProperty("ialertAndroidLocal")) mavenLocal()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "ir.ialert.flutter"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 23
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    if (project.hasProperty("ialertAndroidLocal")) {
        api("ir.ialert:ialert-android:0.5.1")
    } else {
        api("com.github.iAlert-ai:ialert-android:v0.5.1")
    }
}
